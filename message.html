<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Carrot Study App - Organize tasks, manage time, and boost productivity with a Pomodoro timer and task manager.">
  <meta name="keywords" content="Task Manager, Productivity App, Pomodoro Timer, Study App">
  <meta name="author" content="Carrot Studio">
  <title>Carrot Study App 🥕</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header>
    <h1>Carrot Study App 🥕</h1>
    <p>Your ultimate productivity companion!</p>
  </header>

  <main class="container">
    <!-- Add Task Section -->
    <section class="task-section">
      <h2>Add a New Task</h2>
      <form id="taskForm" aria-label="Add new task">
        <label for="taskInput">Task</label>
        <input type="text" id="taskInput" placeholder="Enter your task" required>

        <label for="emojiInput">Emoji (optional)</label>
        <input type="text" id="emojiInput" placeholder="Add an emoji">

        <label for="fileInput">Upload an Image</label>
        <input type="file" id="fileInput" accept="image/*">

        <button type="submit">Add Task</button>
      </form>
    </section>

    <!-- Task List Section -->
    <section>
      <h2>Your Tasks</h2>
      <ul id="taskList" aria-live="polite">
        <!-- Tasks will be dynamically added here -->
      </ul>
    </section>

    <!-- Study Schedule Section -->
    <section>
      <h2>Study Schedule</h2>
      <iframe
        src="https://calendar.google.com/calendar/embed?src=islamdev99%40gmail.com&ctz=UTC"
        style="border: 0" frameborder="0" scrolling="no"
        aria-label="Google Calendar Study Schedule">
      </iframe>
    </section>

    <!-- Pomodoro Timer Section -->
    <section class="timer-section">
      <h2>Pomodoro Timer</h2>
      <div class="pomodoro-timer" id="pomodoroTimer">25:00</div>
      <div class="timer-controls">
        <button id="startTimer">Start</button>
        <button id="stopTimer">Stop</button>
        <button id="resetTimer">Reset</button>
      </div>
    </section>
  </main>

  <footer>
    <p>© 2025 Carrot Studio. All Rights Reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>

</html>
