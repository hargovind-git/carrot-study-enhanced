<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrot Study App</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header>
    <h1>Carrot Study App 🥕</h1>
  </header>

  <div class="container">
    <!-- Add New Task -->
    <section class="task-section">
      <h2>Add New Task</h2>
      <form id="taskForm">
        <input type="text" id="taskInput" placeholder="Enter your task" required>
        <input type="text" id="emojiInput" placeholder="Emoji">
        <input type="file" id="fileInput" accept="image/*">
        <button type="submit">Add Task</button>
      </form>
    </section>

    <!-- Task List -->
    <section>
      <h2>Your Tasks</h2>
      <ul id="taskList">
        <!-- Tasks will be dynamically added here -->
      </ul>
    </section>

    <!-- Study Schedule -->
    <section>
      <h2>Study Schedule</h2>
      <iframe src="https://calendar.google.com/calendar/embed?src=islamdev99%40gmail.com&ctz=UTC" 
              style="border: 0" width="800" height="600" frameborder="0" scrolling="no">
      </iframe>
    </section>

    <!-- Timer -->
    <section>
      <h2>Pomodoro Timer</h2>
      <div class="pomodoro-timer" id="pomodoroTimer">25:00</div>
      <button id="startTimer">Start</button>
      <button id="stopTimer">Stop</button>
      <button id="resetTimer">Reset</button>
    </section>
  </div>

  <footer>
    <p>Developed by Carrot Studio. Open Source. Feel free to modify after permission from Carrot Studio.</p>
  </footer>

  <script src="script.js"></script>
</body>

</html>
